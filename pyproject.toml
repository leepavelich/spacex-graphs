[project]
name = "spacex-graphs"
version = "1.0.0"
description = "Graphs of SpaceX payload mass launched, built from Wikipedia launch lists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
# Runtime dependencies are pinned, with hashes, in requirements.in/requirements.txt

[tool.ruff]
target-version = "py315"
line-length = 88
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # modern syntax for the target Python
    "B",    # likely bugs
    "S",    # security checks
    "SIM",  # simplifications
    "RUF",  # ruff-specific checks
]
ignore = [
    # The formatter owns line length; long string literals in tests are fine
    "E501",
    # Wikipedia text and legend labels use en dashes and non-breaking spaces
    # on purpose, so "ambiguous" Unicode is expected here
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests select Agg before importing pyplot and may use plain assertions.
"tests/*" = ["E402", "S101"]
# The legacy MD5 is a non-security cache filename. Drop when it is replaced.
"spacex_graphs/cache.py" = ["S324"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
# Include the actual python -m and graphs.py processes from the smoke tests.
patch = ["subprocess"]

[tool.coverage.report]
precision = 2

[tool.mypy]
python_version = "3.15"
files = ["spacex_graphs", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
# Tests are type-checked for misuse of the package API, without requiring
# every test method and helper to be annotated
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
