services:
  graphs:
    build:
      context: .
      dockerfile: Dockerfile
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./outputs:/app/outputs
      # A named volume, so the unprivileged container user owns it even on
      # Linux hosts where Docker would create a missing bind-mount dir as root
      - cache:/app/.cache

volumes:
  cache:
