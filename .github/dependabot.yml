# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised or
    # broken release is usually caught and yanked before it reaches here
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised or
    # broken release is usually caught and yanked before it reaches here
    cooldown:
      default-days: 7
    # One PR for all pip bumps: pandas and matplotlib share a numpy ABI
    # constraint, so bumping one alone can break the other at import time
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised or
    # broken release is usually caught and yanked before it reaches here
    cooldown:
      default-days: 7
