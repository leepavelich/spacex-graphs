name: Auto Update Graphs

on:
  schedule:
    - cron: "15 11 * * *" # Runs at 11:15 UTC every day
  workflow_dispatch:

# A manual dispatch overlapping the scheduled run would race the push
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update-graphs:
    runs-on: ubuntu-latest
    # The job's GITHUB_TOKEN only needs to push the regenerated outputs
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests

      - name: Cache Wikipedia data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: wikipedia-cache-${{ github.run_id }}
          restore-keys: |
            wikipedia-cache-

      - name: Run Script
        run: python3 graphs.py --output

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(outputs): update graphs by scheduler"
          branch: ${{ github.ref }}
          file_pattern: outputs/*.svg outputs/*.csv
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
          commit_author: GitHub Actions <actions@github.com>
