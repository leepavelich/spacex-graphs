name: Auto Update Graphs

on:
  schedule:
    - cron: "15 11 * * *" # Runs at 11:15 UTC every day
  workflow_dispatch:

# A manual dispatch overlapping the scheduled run would race the push
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update-graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The job's GITHUB_TOKEN pushes the regenerated outputs and opens an issue
    # when the run fails
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests

      - name: Cache Wikipedia data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: wikipedia-cache-${{ github.run_id }}
          restore-keys: |
            wikipedia-cache-

      - name: Run Script
        run: python3 graphs.py --output

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore(outputs): update graphs by scheduler"
          branch: ${{ github.ref }}
          file_pattern: outputs/*.svg outputs/*.csv
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
          commit_author: GitHub Actions <actions@github.com>

      - name: Report Failure
        # A failing scheduled job otherwise only sends GitHub's default email;
        # one open issue collects every failure until someone closes it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled graph update is failing"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled update failed, so the published graphs weren't updated. Run: $RUN_URL. Its annotations and job summary say why; close this issue once it's fixed."
          fi
