name: Auto Update Graphs

on:
  schedule:
    - cron: "15 11 * * *" # Runs at 11:15 UTC every day
  workflow_dispatch:

# A manual dispatch overlapping the scheduled run would race the push
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update-graphs:
    runs-on: ubuntu-latest
    # The job's GITHUB_TOKEN only needs to push the regenerated outputs
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests

      - name: Cache Wikipedia data
        uses: actions/cache@v6
        with:
          path: .cache
          key: wikipedia-cache-${{ github.run_id }}
          restore-keys: |
            wikipedia-cache-

      - name: Run Script
        run: python3 graphs.py --output

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(outputs): update graphs by scheduler"
          branch: ${{ github.ref }}
          file_pattern: outputs/*.svg outputs/*.csv
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
          commit_author: GitHub Actions <actions@github.com>
