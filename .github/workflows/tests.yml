name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check Formatting
        run: ruff format --check .

      - name: Type Check
        run: mypy

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Audit Dependencies for Known Vulnerabilities
        run: |
          pip-audit --progress-spinner off --disable-pip --require-hashes -r requirements.txt
          pip-audit --progress-spinner off --disable-pip --require-hashes -r requirements-dev.txt

      - name: Check Lock Files Match Their Sources
        # Fails when requirements*.txt no longer match requirements*.in, for
        # example after a dependency update that changed only one of them
        run: |
          scripts/update-locks.sh
          git diff --exit-code -- requirements.txt requirements-dev.txt

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Image
        run: docker build --tag spacex-graphs .

      - name: Smoke Test
        # Confirms the installed dependencies import and the CLI starts; the
        # real run needs network access to Wikipedia, which tests don't use
        run: docker run --rm spacex-graphs --help

