name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Audit for newly disclosed vulnerabilities each Monday.

permissions:
  contents: read

# A newer push to the same pull request supersedes the running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check Formatting
        run: ruff format --check .

      - name: Type Check
        run: mypy

      - name: Generate a Non-English Test Locale
        run: |
          sudo localedef -i fr_FR -f UTF-8 fr_FR.UTF-8
          locale -a | grep -Fx fr_FR.utf8

      - name: Run Tests and Enforce Coverage
        run: |
          coverage run --branch -m unittest discover -s tests -v
          coverage report --fail-under=95 --show-missing

      - name: Audit Dependencies for Known Vulnerabilities
        run: |
          pip-audit --progress-spinner off --disable-pip --require-hashes -r requirements.txt
          pip-audit --progress-spinner off --disable-pip --require-hashes -r requirements-dev.txt

      - name: Check Lock Files Match Their Sources
        # Fails when requirements*.txt no longer match requirements*.in, for
        # example after a dependency update that changed only one of them
        run: scripts/check.sh --locks-only

  lint-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions Workflows
        # actionlint v1.7.12
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Lint Dockerfile
        # hadolint v2.15.1
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            < Dockerfile

      - name: Lint Shell Scripts
        # ShellCheck v0.11.0
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -v "$PWD:/repo:ro" -w /repo \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/check.sh scripts/update-locks.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Image
        run: docker build --tag spacex-graphs .

      - name: Smoke Test
        # Confirms the installed dependencies import and the CLI starts; the
        # real run needs network access to Wikipedia, which tests don't use
        run: |
          docker run --rm spacex-graphs --help
          docker run --rm --user 12345:12345 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true spacex-graphs --help
          docker run --rm --user 12345:12345 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint python3 spacex-graphs -m spacex_graphs --help

      - name: Test in the Hardened Runtime Image
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true --user 12345:12345 \
            -v "$PWD/tests:/app/tests:ro" -v "$PWD/outputs:/app/outputs:ro" \
            --entrypoint python3 spacex-graphs -m unittest discover -s tests

